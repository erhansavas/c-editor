name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Every gate with the newest tools, and the DMG that is released.
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tests (ASan/UBSan), Apple silicon
        run: ./build.sh test
      - name: Tests (ASan/UBSan), Intel code under Rosetta
        run: arch -x86_64 ./build.sh test
      - name: Debug app (ASan/UBSan)
        run: ./build.sh debug
      - name: Universal DMG
        run: ./build.sh dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmg
          path: build/dist/C-Editor-*.dmg*
          if-no-files-found: error
          retention-days: 7

  # A clean clone on an Intel Mac, with the commands the README gives.
  from-source-intel:
    runs-on: macos-26-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: This Mac
        run: |
          sw_vers
          uname -m
          xcodebuild -version
      - name: Tests (ASan/UBSan)
        run: ./build.sh test
      - name: The app
        run: ./build.sh

  # That DMG on the oldest macOS images GitHub offers, Intel and Apple silicon: the app starts, and the tests pass
  # against the compat folder inside it with each of the image's own compilers.
  shipped-app:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dmg
          path: dmg
      - name: This Mac
        run: |
          sw_vers
          uname -m
          ls -d /Applications/Xcode*.app /Library/Developer/CommandLineTools 2>/dev/null || true
      - name: The DMG is the one that was built, and holds this Mac's architecture and minimum macOS
        run: |
          cd dmg
          shasum -a 256 -c C-Editor-*.dmg.sha256
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/dmg" C-Editor-*.dmg
          app="$RUNNER_TEMP/dmg/C Editor.app"
          codesign --verify --deep --strict "$app"
          lipo "$app/Contents/MacOS/c-editor" -verify_arch "$(uname -m)"
          minimum="$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")"
          xcrun vtool -arch "$(uname -m)" -show-build "$app/Contents/MacOS/c-editor" | grep -q "minos $minimum"
          echo "architectures: $(lipo -archs "$app/Contents/MacOS/c-editor"); minimum macOS: $minimum"
      - name: The app starts
        run: |
          "$RUNNER_TEMP/dmg/C Editor.app/Contents/MacOS/c-editor" &
          sleep 10
          kill -0 $! && kill $!
      - name: Tests from source (ASan/UBSan)
        run: ./build.sh test
      - name: Tests against the DMG's compat folder, with each compiler on this image
        run: |
          compat="$RUNNER_TEMP/dmg/C Editor.app/Contents/Resources/compat"
          # Each Xcode once (the image links one app under several names), then the Command Line Tools.
          { for xcode in /Applications/Xcode_*.app; do echo "$(realpath "$xcode")/Contents/Developer"; done | sort -u
            echo /Library/Developer/CommandLineTools; } | while read -r tools; do
            [ -d "$tools" ] || continue
            echo "::group::$tools"
            DEVELOPER_DIR="$tools" clang --version
            DEVELOPER_DIR="$tools" build/test/tests "$compat" "$PWD/build/tmp" < /dev/null
            echo "::endgroup::"
          done
